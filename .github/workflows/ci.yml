name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the supported minimum; 3.15 matches the container image.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Tests
        run: bash scripts/run_tests.sh --coverage
      - name: Coverage gate (90%)
        run: coverage report --fail-under=90
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint k8s/helm --set-string secrets.JWT_SECRET=ci-only

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pip-licenses cyclonedx-bom
      - name: License check (permissive and weak-copyleft only)
        run: >-
          pip-licenses --partial-match
          --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation;LGPL;Lesser General Public;MPL;Mozilla Public;Unlicense;CC0;0BSD;Zlib;HPND"
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
