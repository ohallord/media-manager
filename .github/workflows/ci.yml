name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Tests
        run: bash scripts/run_tests.sh --coverage
      - name: Coverage gate (90%)
        run: coverage report --fail-under=90
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint k8s/helm --set-string secrets.JWT_SECRET=ci-only
