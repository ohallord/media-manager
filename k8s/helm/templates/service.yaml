apiVersion: v1
kind: Service
metadata:
  name: {{ include "media-manager.fullname" . }}
  labels:
    {{- include "media-manager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.env.WEB_PORT }}
      protocol: TCP
      name: http
  selector:
    {{- include "media-manager.labels" . | nindent 4 }}
